# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: music-player-api-test
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /healthz
    buildCommand: npm install --global bun@1.4.0 && bun install --frozen-lockfile && bun run build:api
    startCommand: node dist-render/server.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: BLOB_PUBLIC_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
